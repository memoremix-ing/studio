[package]
name = "memoremix-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[lib]
name = "studio"

[[bin]]
name = "studio"
path = "src/main.rs"

[workspace]
members = ["."]
exclude = ["desktop"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
hex = "0.4"
mxc-sdk = "=1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[lints.rust]
unsafe_code = "forbid"
